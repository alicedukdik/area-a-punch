<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ยืนยันการแก้ไข</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10161C; --panel:#1A232C; --panel-2:#212C36; --line:#2B3742;
    --text:#EDEFF2; --muted:#8996A5; --amber:#E8A33D; --ok:#4C9A6A; --ok-dim:#1E332A; --fix:#D3543F; --fix-dim:#3A2320;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--text);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px;}

  .eyebrow{font-size:10.5px;color:var(--muted);}
  h1{font-size:19px;font-weight:600;margin:2px 0 16px;}
  .auth-status{font-size:11px;color:var(--muted);margin:-10px 0 16px;}

  .gate{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:40px 10px;text-align:center;}
  .gate.hide{display:none;}
  .gate p{color:var(--muted);font-size:13.5px;line-height:1.6;}
  .gate button{background:var(--amber);color:#2A1B05;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;}

  .card{display:none;}
  .card.show{display:block;}
  .pid{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--amber);}
  .zone-tag{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .desc-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;font-size:14px;line-height:1.6;}

  .field-label{font-size:12px;color:var(--muted);margin:18px 0 8px;}
  textarea{width:100%;min-height:60px;resize:none;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'IBM Plex Sans Thai',sans-serif;font-size:13.5px;padding:10px 12px;}
  textarea::placeholder{color:#5C6773;}

  .photo-section-label{display:flex;justify-content:space-between;align-items:baseline;}
  .photo-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .photo-count.full{color:var(--fix);}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(16,22,28,.85);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
  .photo-add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;cursor:pointer;}
  .photo-add .icon{font-size:18px;}
  #photoInput{display:none;}

  .cta{width:100%;margin-top:20px;padding:15px;border-radius:12px;border:none;font-family:'IBM Plex Sans Thai',sans-serif;font-size:15px;font-weight:600;cursor:pointer;color:#0D1A13;background:var(--ok);}
  .cta:disabled{opacity:.4;pointer-events:none;}
  .cta.loading{opacity:.6;pointer-events:none;}

  .result-note{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;display:none;white-space:pre-line;}
  .result-note.show{display:block;}
  .result-note.ok{background:var(--ok-dim);border:1px solid var(--ok);color:#8FD8A9;}
  .result-note.error{background:var(--fix-dim);border:1px solid var(--fix);color:#F0A99B;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow mono">GOOGLE SHEET · PUNCH_LIST</div>
  <h1>ยืนยันการแก้ไข</h1>
  <div class="auth-status" id="authStatus">กำลังเชื่อมต่อ LINE...</div>

  <div class="gate" id="gate">
    <p>ต้องเข้าสู่ระบบด้วย LINE ก่อนใช้งาน</p>
    <button id="loginBtn">เข้าสู่ระบบด้วย LINE</button>
  </div>

  <div class="card" id="card">
    <div class="pid mono" id="cPid">—</div>
    <div class="zone-tag" id="cZone">—</div>
    <div class="desc-box" id="cDesc">—</div>

    <div class="field-label">หมายเหตุ (ถ้ามี)</div>
    <textarea id="remarkInput" placeholder="เช่น เปลี่ยน Tag ใหม่เรียบร้อยแล้ว"></textarea>

    <div class="photo-section-label">
      <div class="field-label" style="margin-bottom:0;">รูปหน้างานที่แก้ไขแล้ว</div>
      <span class="photo-count mono" id="photoCount">0/10</span>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple>
    <div class="photo-grid" id="photoGrid">
      <div class="photo-add" id="photoAdd"><div class="icon">📷</div><div>เพิ่มรูป</div></div>
    </div>

    <button class="cta" id="ctaBtn" disabled>เลือกอย่างน้อย 1 รูปก่อน</button>
    <div class="result-note" id="resultNote"></div>
  </div>

  <div class="result-note error" id="noPunchIdNote" style="display:none;">ไม่พบเลข Punch ในลิงก์ กรุณาเปิดจากปุ่มในกลุ่มไลน์อีกครั้ง</div>
</div>

<script>
// ============== ตั้งค่า 2 ค่านี้ก่อนใช้งานจริง ==============
const LIFF_ID = '2011497735-KaNRZ1ea';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-C_-coHjAIW7FV3qdWVge8bZSGm8bpj5lhIOCFxjirEd8H1kZ4YJx8tDhLL8TSTQV/exec';
// =============================================================

const MAX_PHOTOS = 10;
let photos = [];
let displayName = '';
let punchId = null;

const gate = document.getElementById('gate');
const card = document.getElementById('card');
const authStatus = document.getElementById('authStatus');
const loginBtn = document.getElementById('loginBtn');
const noPunchIdNote = document.getElementById('noPunchIdNote');

function getQueryParam(name){
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

async function initLiff(){
  punchId = getQueryParam('punchId');
  if(!punchId){
    authStatus.style.display = 'none';
    noPunchIdNote.style.display = 'block';
    return;
  }
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){
      authStatus.textContent = 'ยังไม่ได้เข้าสู่ระบบ';
      gate.style.display = 'flex';
      return;
    }
    const profile = await liff.getProfile();
    displayName = profile.displayName;
    authStatus.textContent = 'เข้าสู่ระบบแล้ว: ' + profile.displayName;
    gate.style.display = 'none';
    loadPunch();
  }catch(err){
    authStatus.textContent = 'เชื่อมต่อ LINE ไม่สำเร็จ: ' + err.message;
  }
}
loginBtn.addEventListener('click', ()=> liff.login());

function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง')); }, 15000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timer); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('โหลดข้อมูลจากเซิร์ฟเวอร์ไม่สำเร็จ')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function loadPunch(){
  try{
    const data = await jsonpRequest(APPS_SCRIPT_URL + '?punchId=' + encodeURIComponent(punchId));
    if(!data.found){
      noPunchIdNote.textContent = 'ไม่พบเลข ' + punchId + ' ในชีต';
      noPunchIdNote.style.display = 'block';
      return;
    }
    document.getElementById('cPid').textContent = data.punchId;
    document.getElementById('cZone').textContent = 'โซน: ' + data.zone + (data.tag ? ' · Tag: ' + data.tag : '');
    document.getElementById('cDesc').textContent = data.description;
    card.classList.add('show');
  }catch(err){
    noPunchIdNote.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + err.message;
    noPunchIdNote.style.display = 'block';
  }
}

// ---------- รูปภาพ ----------
const photoInput = document.getElementById('photoInput');
const photoGrid = document.getElementById('photoGrid');
const photoCount = document.getElementById('photoCount');
const ctaBtn = document.getElementById('ctaBtn');

function renderPhotoGrid(){
  photoGrid.querySelectorAll('.photo-thumb').forEach(el=>el.remove());
  photos.forEach((src, i)=>{
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    thumb.innerHTML = `<img src="${src}"><div class="rm" data-i="${i}">✕</div>`;
    photoGrid.insertBefore(thumb, document.getElementById('photoAdd'));
  });
  photoGrid.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{ ev.stopPropagation(); photos.splice(parseInt(btn.dataset.i),1); renderPhotoGrid(); });
  });
  photoCount.textContent = photos.length + '/' + MAX_PHOTOS;
  photoCount.classList.toggle('full', photos.length >= MAX_PHOTOS);
  document.getElementById('photoAdd').style.display = photos.length >= MAX_PHOTOS ? 'none' : 'flex';
  ctaBtn.disabled = photos.length === 0;
  ctaBtn.textContent = photos.length === 0 ? 'เลือกอย่างน้อย 1 รูปก่อน' : 'บันทึก + ส่งรูปเข้ากลุ่ม →';
}
document.getElementById('photoAdd').addEventListener('click', ()=> photoInput.click());
photoInput.addEventListener('change', ()=>{
  const files = Array.from(photoInput.files).slice(0, MAX_PHOTOS - photos.length);
  let loaded = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{ photos.push(ev.target.result); loaded++; if(loaded===files.length) renderPhotoGrid(); };
    reader.readAsDataURL(file);
  });
  photoInput.value = '';
});
renderPhotoGrid();

// ---------- ส่งข้อมูลแบบไม่ติด CORS (hidden iframe + form) ----------
function iframePost(url, payload){
  return new Promise((resolve)=>{
    const frameName = 'post_frame_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = frameName;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);

    let done = false;
    iframe.addEventListener('load', ()=>{
      if(done) return; done = true;
      setTimeout(()=>{ form.remove(); iframe.remove(); resolve(); }, 300);
    });
    setTimeout(()=>{
      if(done) return; done = true;
      form.remove(); iframe.remove(); resolve();
    }, 4000);
    form.submit();
  });
}

const resultNote = document.getElementById('resultNote');
ctaBtn.addEventListener('click', async ()=>{
  ctaBtn.classList.add('loading');
  ctaBtn.textContent = 'กำลังบันทึก...';
  const payload = {
    type: 'techFix',
    punchId: punchId,
    remark: document.getElementById('remarkInput').value.trim(),
    submittedBy: displayName || 'ไม่ทราบชื่อ',
    photos: photos.map(p => p.split(',')[1])
  };
  try{
    await iframePost(APPS_SCRIPT_URL, payload);
    await new Promise(r => setTimeout(r, 2000));
    const check = await jsonpRequest(APPS_SCRIPT_URL + '?punchId=' + encodeURIComponent(punchId));
    resultNote.className = 'result-note ok show';
    resultNote.textContent = '✓ บันทึกการแก้ไข ' + punchId + ' เรียบร้อยแล้ว (แนบ ' + photos.length + ' รูป) — ปิดหน้านี้ได้เลย';
    ctaBtn.style.display = 'none';
  }catch(err){
    resultNote.className = 'result-note error show';
    resultNote.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + err.message;
    ctaBtn.classList.remove('loading');
    renderPhotoGrid();
  }
});

initLiff();
</script>
</body>
</html>
